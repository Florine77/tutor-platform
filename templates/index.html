<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家教工作台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #f5f7fa; display: flex; min-height: 100vh; }

        .sidebar { width: 220px; background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%); color: #fff; padding: 20px 0; flex-shrink: 0; }
        .sidebar .logo { padding: 0 20px 30px; font-size: 20px; font-weight: bold; letter-spacing: 2px; }
        .sidebar .logo span { color: #4cc9f0; }
        .nav-item { padding: 14px 20px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 10px; font-size: 14px; border-left: 3px solid transparent; }
        .nav-item:hover { background: rgba(255,255,255,0.05); }
        .nav-item.active { background: rgba(76,201,240,0.15); border-left-color: #4cc9f0; color: #4cc9f0; }
        .nav-item .icon { font-size: 18px; width: 24px; text-align: center; }

        .main { flex: 1; padding: 0; display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #fff; padding: 16px 30px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 22px; color: #1a1a2e; }
        .content { flex: 1; padding: 24px 30px; overflow-y: auto; }

        .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card h3 { margin-bottom: 16px; color: #1a1a2e; font-size: 17px; border-bottom: 2px solid #4cc9f0; padding-bottom: 10px; display: inline-block; }
        .btn { padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .btn-primary { background: #4cc9f0; color: #fff; }
        .btn-primary:hover { background: #3db8df; }
        .btn-success { background: #06d6a0; color: #fff; }
        .btn-success:hover { background: #05b98a; }
        .btn-danger { background: #ef476f; color: #fff; }
        .btn-danger:hover { background: #d63d5f; }
        .btn-outline { background: #fff; border: 1px solid #ccc; color: #555; }
        .btn-outline:hover { background: #f5f5f5; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }

        input, textarea, select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 12px; font-family: inherit; transition: border 0.3s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #4cc9f0; box-shadow: 0 0 0 3px rgba(76,201,240,0.1); }
        textarea { resize: vertical; min-height: 80px; }
        label { font-size: 13px; color: #666; margin-bottom: 4px; display: block; font-weight: 500; }
        .row { display: flex; gap: 16px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 200px; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; color: #555; }
        tr:hover { background: #f8f9ff; }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-blue { background: #e0f0ff; color: #0077b6; }
        .badge-green { background: #d8f3dc; color: #2d6a4f; }
        .badge-orange { background: #fff3e0; color: #e67e22; }

        .empty-state { text-align: center; padding: 60px; color: #aaa; }
        .empty-state .big-icon { font-size: 48px; margin-bottom: 16px; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: #fff; border-radius: 16px; padding: 30px; width: 90%; max-width: 700px; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .modal h2 { margin-bottom: 20px; }

        .tab-bar { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { padding: 10px 20px; cursor: pointer; border: none; background: none; font-size: 14px; color: #888; transition: all 0.3s; }
        .tab.active { color: #4cc9f0; border-bottom: 2px solid #4cc9f0; margin-bottom: -2px; }

        .progress-bar { height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; margin: 8px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4cc9f0, #06d6a0); border-radius: 4px; transition: width 0.5s; }

        .feedback-box { background: #f0fff0; border: 1px solid #b7e4c7; border-radius: 8px; padding: 16px; white-space: pre-wrap; font-size: 14px; line-height: 1.8; margin: 12px 0; }

        .step-indicator { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
        .step { padding: 6px 14px; border-radius: 20px; font-size: 12px; background: #eee; color: #999; }
        .step.active { background: #4cc9f0; color: #fff; }
        .step.done { background: #06d6a0; color: #fff; }
        .step-arrow { color: #ccc; }

        .timer-display { font-size: 28px; font-weight: bold; color: #1a1a2e; text-align: center; padding: 10px; }
        .timer-controls { display: flex; gap: 10px; justify-content: center; }

        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar .logo { font-size: 14px; padding: 0 10px 20px; }
            .nav-item { padding: 14px 10px; justify-content: center; }
            .nav-item span:last-child { display: none; }
            .row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">📚 <span>家教工作台</span></div>
        <div class="nav-item active" data-page="students"><span class="icon">👥</span> <span>学生管理</span></div>
        <div class="nav-item" data-page="plans"><span class="icon">📝</span> <span>备课中心</span></div>
        <div class="nav-item" data-page="classroom"><span class="icon">🏫</span> <span>上课工作台</span></div>
        <div class="nav-item" data-page="reviews"><span class="icon">📋</span> <span>课后复盘</span></div>
        <div class="nav-item" data-page="tracking"><span class="icon">📈</span> <span>长期跟进</span></div>
        <div class="nav-item" data-page="dashboard"><span class="icon">📊</span> <span>数据中心</span></div>
    </div>
    <div class="main">
        <div class="header">
            <h1 id="pageTitle">学生管理</h1>
            <div><span id="currentTime" style="color:#888;font-size:13px;"></span></div>
        </div>
        <div class="content" id="contentArea"></div>
    </div>

    <div id="modalContainer"></div>

    <script>
        const API = '';
        let currentPage = 'students';
        let students = [];
        let lessonPlans = [];
        let lessonReviews = [];
        let errorBook = [];
        let stageTests = [];

        async function api(url, method='GET', body=null) {
            const opts = { method, headers: {'Content-Type':'application/json'} };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(API + url, opts);
            return res.json();
        }

        function formatDate(d) {
            if (!d) return '';
            const date = new Date(d);
            return date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
        }

        function updateTime() {
            const el = document.getElementById('currentTime');
            if (el) el.textContent = new Date().toLocaleString('zh-CN');
        }
        setInterval(updateTime, 1000);
        updateTime();

        function switchPage(page) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            const target = document.querySelector(`[data-page="${page}"]`);
            if (target) target.classList.add('active');
            currentPage = page;
            const titles = { students:'学生管理', plans:'备课中心', classroom:'上课工作台', reviews:'课后复盘', tracking:'长期跟进', dashboard:'数据中心' };
            document.getElementById('pageTitle').textContent = titles[page] || '';
            renderPage();
        }

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                switchPage(this.dataset.page);
            });
        });

        async function renderPage() {
            const area = document.getElementById('contentArea');
            if (!area) return;
            await loadAllData();
            switch(currentPage) {
                case 'students': renderStudents(area); break;
                case 'plans': renderPlans(area); break;
                case 'classroom': renderClassroom(area); break;
                case 'reviews': renderReviews(area); break;
                case 'tracking': renderTracking(area); break;
                case 'dashboard': renderDashboard(area); break;
            }
        }

        async function loadAllData() {
            try {
                const [s, p, r, e, t] = await Promise.all([
                    api('/api/students'), api('/api/lesson-plans'), api('/api/lesson-reviews'),
                    api('/api/error-book'), api('/api/stage-tests')
                ]);
                if (Array.isArray(s)) students = s;
                if (Array.isArray(p)) lessonPlans = p;
                if (Array.isArray(r)) lessonReviews = r;
                if (Array.isArray(e)) errorBook = e;
                if (Array.isArray(t)) stageTests = t;
            } catch(err) { console.error('数据加载失败', err); }
        }

        function getStudentName(id) {
            const s = students.find(s => s.id === id);
            return s ? s.name : '未知学生';
        }

        function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

        // ==================== 学生管理 ====================
        function renderStudents(area) {
            let html = '<div class="card"><button class="btn btn-primary" onclick="showStudentModal()">+ 添加学生</button></div>';
            if (students.length === 0) {
                html += '<div class="card empty-state"><div class="big-icon">👥</div><p>还没有学生，点击上方按钮添加第一个学生</p></div>';
            } else {
                html += '<div class="card"><table><thead><tr><th>姓名</th><th>年级</th><th>科目</th><th>目标</th><th>薄弱点</th><th>性格</th><th>操作</th></tr></thead><tbody>';
                students.forEach(s => {
                    html += `<tr>
                        <td><strong>${s.name}</strong></td>
                        <td>${s.grade||'-'}</td>
                        <td>${s.subject||'-'}</td>
                        <td><span class="badge badge-blue">${s.goal||'-'}</span></td>
                        <td>${(s.weaknesses||'').substring(0,15)}</td>
                        <td>${s.personality||'-'}</td>
                        <td>
                            <button class="btn btn-outline btn-sm" onclick="showStudentModal(${s.id})">编辑</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteStudent(${s.id})">删除</button>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table></div>';
            }
            area.innerHTML = html;
        }

        function showStudentModal(id=null) {
            const s = id ? students.find(s => s.id === id) : {};
            const modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                    <div class="modal">
                        <h2>${id?'编辑学生':'添加学生'}</h2>
                        <div class="row">
                            <div class="col"><label>姓名 *</label><input id="s_name" value="${s.name||''}"></div>
                            <div class="col"><label>年级</label><input id="s_grade" value="${s.grade||''}"></div>
                        </div>
                        <div class="row">
                            <div class="col"><label>科目</label><input id="s_subject" value="${s.subject||''}"></div>
                            <div class="col"><label>目标</label><select id="s_goal"><option value="">请选择</option><option value="提分" ${s.goal==='提分'?'selected':''}>提分</option><option value="补基础" ${s.goal==='补基础'?'selected':''}>补基础</option><option value="培优" ${s.goal==='培优'?'selected':''}>培优</option></select></div>
                        </div>
                        <label>薄弱点</label><textarea id="s_weaknesses">${s.weaknesses||''}</textarea>
                        <div class="row">
                            <div class="col"><label>性格标签</label><input id="s_personality" value="${s.personality||''}" placeholder="如：内向、活泼、叛逆期"></div>
                            <div class="col"><label>注意力</label><select id="s_attention"><option value="">请选择</option><option value="集中" ${s.attention==='集中'?'selected':''}>集中</option><option value="一般" ${s.attention==='一般'?'selected':''}>一般</option><option value="容易走神" ${s.attention==='容易走神'?'selected':''}>容易走神</option></select></div>
                        </div>
                        <div class="row">
                            <div class="col"><label>上课设备</label><input id="s_device" value="${s.device||''}" placeholder="如：iPad+手写笔、电脑"></div>
                            <div class="col"><label>家长联系方式</label><input id="s_parent_contact" value="${s.parent_contact||''}" placeholder="微信/电话"></div>
                        </div>
                        <label>家长备注</label><textarea id="s_parent_notes">${s.parent_notes||''}</textarea>
                        <br>
                        <button class="btn btn-primary" onclick="saveStudent(${id||0})">保存</button>
                        <button class="btn btn-outline" onclick="closeModal()">取消</button>
                    </div>
                </div>`;
        }

        async function saveStudent(id) {
            const getName = (n) => document.getElementById(n)?.value || '';
            const data = {
                name: getName('s_name'),
                grade: getName('s_grade'),
                subject: getName('s_subject'),
                goal: getName('s_goal'),
                weaknesses: getName('s_weaknesses'),
                personality: getName('s_personality'),
                attention: getName('s_attention'),
                device: getName('s_device'),
                parent_contact: getName('s_parent_contact'),
                parent_notes: getName('s_parent_notes')
            };
            if (!data.name) { alert('请输入学生姓名'); return; }
            await api('/api/students' + (id ? '/'+id : ''), id ? 'PUT' : 'POST', data);
            closeModal();
            renderPage();
        }

        async function deleteStudent(id) {
            if (!confirm('确定删除该学生吗？')) return;
            await api('/api/students/'+id, 'DELETE');
            renderPage();
        }

        // ==================== 备课中心 ====================
        function renderPlans(area) {
            let html = '<div class="card"><button class="btn btn-primary" onclick="showPlanModal()">+ 新建备课</button></div>';
            if (lessonPlans.length === 0) {
                html += '<div class="card empty-state"><div class="big-icon">📝</div><p>还没有备课记录</p></div>';
            } else {
                html += '<div class="card"><table><thead><tr><th>标题</th><th>学生</th><th>目标</th><th>时间</th><th>操作</th></tr></thead><tbody>';
                lessonPlans.forEach(p => {
                    html += `<tr>
                        <td><strong>${p.title||'未命名'}</strong></td>
                        <td>${getStudentName(p.student_id)}</td>
                        <td>${(p.objectives||'').substring(0,20)}</td>
                        <td>${formatDate(p.created_at)}</td>
                        <td><button class="btn btn-outline btn-sm" onclick="showPlanModal(${p.id})">查看</button></td>
                    </tr>`;
                });
                html += '</tbody></table></div>';
            }
            area.innerHTML = html;
        }

        function showPlanModal(id=null) {
            const p = id ? lessonPlans.find(p => p.id === id) : {};
            document.getElementById('modalContainer').innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                    <div class="modal" style="max-width:800px;">
                        <h2>${id?'备课详情':'新建备课'}</h2>
                        <div class="row">
                            <div class="col"><label>标题</label><input id="p_title" value="${p.title||''}"></div>
                            <div class="col"><label>学生 *</label><select id="p_student_id">${students.map(s => `<option value="${s.id}" ${p.student_id===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div>
                        </div>
                        <label>教学目标</label><textarea id="p_objectives">${p.objectives||''}</textarea>
                        <label>知识点梳理</label><textarea id="p_knowledge_points">${p.knowledge_points||''}</textarea>
                        <label>例题</label><textarea id="p_examples">${p.examples||''}</textarea>
                        <label>预设问题</label><textarea id="p_expected_problems">${p.expected_problems||''}</textarea>
                        <div class="row"><div class="col"><label>资料链接</label><input id="p_materials_link" value="${p.materials_link||''}"></div><div class="col"><label>课后作业</label><textarea id="p_homework">${p.homework||''}</textarea></div></div>
                        <label>时间估算（分钟）</label>
                        <div class="row">
                            <div class="col"><label>暖场</label><input type="number" id="p_warmup" value="${p.estimated_minutes_warmup||5}"></div>
                            <div class="col"><label>讲解</label><input type="number" id="p_teaching" value="${p.estimated_minutes_teaching||20}"></div>
                            <div class="col"><label>练习</label><input type="number" id="p_practice" value="${p.estimated_minutes_practice||20}"></div>
                            <div class="col"><label>小测</label><input type="number" id="p_quiz" value="${p.estimated_minutes_quiz||10}"></div>
                            <div class="col"><label>总结</label><input type="number" id="p_summary" value="${p.estimated_minutes_summary||5}"></div>
                        </div>
                        <br>
                        <button class="btn btn-primary" onclick="savePlan()">保存</button>
                        <button class="btn btn-outline" onclick="closeModal()">取消</button>
                    </div>
                </div>`;
        }

        async function savePlan() {
            const g = (n) => document.getElementById(n)?.value || '';
            const data = {
                student_id: parseInt(g('p_student_id')),
                title: g('p_title'), objectives: g('p_objectives'), knowledge_points: g('p_knowledge_points'),
                examples: g('p_examples'), expected_problems: g('p_expected_problems'),
                materials_link: g('p_materials_link'), homework: g('p_homework'),
                estimated_minutes_warmup: parseInt(g('p_warmup')), estimated_minutes_teaching: parseInt(g('p_teaching')),
                estimated_minutes_practice: parseInt(g('p_practice')), estimated_minutes_quiz: parseInt(g('p_quiz')),
                estimated_minutes_summary: parseInt(g('p_summary'))
            };
            if (!data.student_id) { alert('请选择学生'); return; }
            await api('/api/lesson-plans', 'POST', data);
            closeModal();
            renderPage();
        }

        // ==================== 上课工作台 ====================
        let timerInterval = null, timerSeconds = 0, timerRunning = false;

        function renderClassroom(area) {
            if (lessonPlans.length === 0) {
                area.innerHTML = '<div class="card empty-state"><div class="big-icon">🏫</div><p>请先到备课中心创建备课</p></div>';
                return;
            }
            const plan = lessonPlans[0];
            let html = `
                <div class="card">
                    <div class="row"><div class="col"><label>选择备课</label><select id="classroom_plan" onchange="updateClassroomPlan()">${lessonPlans.map(p => `<option value="${p.id}">${p.title||'未命名'} - ${getStudentName(p.student_id)}</option>`).join('')}</select></div>
                    <div class="col" style="text-align:right"><div class="timer-display" id="timerDisplay">00:00</div>
                    <div class="timer-controls"><button class="btn btn-success btn-sm" onclick="startTimer()">▶</button><button class="btn btn-outline btn-sm" onclick="pauseTimer()">⏸</button><button class="btn btn-outline btn-sm" onclick="resetTimer()">↺</button></div></div></div>
                </div>
                <div class="card"><h3>📋 上课流程</h3>
                <div class="step-indicator"><span class="step active">🔥 暖场 (${plan.estimated_minutes_warmup}min)</span><span class="step-arrow">→</span><span class="step">📖 讲解 (${plan.estimated_minutes_teaching}min)</span><span class="step-arrow">→</span><span class="step">✏️ 练习 (${plan.estimated_minutes_practice}min)</span><span class="step-arrow">→</span><span class="step">📝 小测 (${plan.estimated_minutes_quiz}min)</span><span class="step-arrow">→</span><span class="step">📋 总结 (${plan.estimated_minutes_summary}min)</span></div>
                <div id="classroomContent"></div></div>`;
            area.innerHTML = html;
            updateClassroomPlan();
        }

        function updateClassroomPlan() {
            const planId = parseInt(document.getElementById('classroom_plan')?.value);
            const plan = lessonPlans.find(p => p.id === planId);
            if (!plan) return;
            document.getElementById('classroomContent').innerHTML = `
                <div class="row"><div class="col"><h4>🎯 目标</h4><p style="white-space:pre-wrap;">${plan.objectives||'未设定'}</p><h4>📚 知识点</h4><p style="white-space:pre-wrap;">${plan.knowledge_points||'未设定'}</p></div>
                <div class="col"><h4>📝 例题</h4><p style="white-space:pre-wrap;">${plan.examples||'未设定'}</p><h4>⚠️ 预设问题</h4><p style="white-space:pre-wrap;">${plan.expected_problems||'未设定'}</p><h4>📎 资料</h4><p>${plan.materials_link||'无'}</p><h4>📤 作业</h4><p style="white-space:pre-wrap;">${plan.homework||'未设定'}</p></div></div>
                <button class="btn btn-primary" onclick="switchPage('reviews');setTimeout(()=>showReviewModal(${plan.id}),300)" style="margin-top:16px;">📋 下课，去复盘</button>`;
        }

        function startTimer() { if(timerRunning) return; timerRunning=true; timerInterval=setInterval(()=>{ timerSeconds++; const m=Math.floor(timerSeconds/60).toString().padStart(2,'0'); const s=(timerSeconds%60).toString().padStart(2,'0'); const el=document.getElementById('timerDisplay'); if(el) el.textContent=m+':'+s; },1000); }
        function pauseTimer() { timerRunning=false; clearInterval(timerInterval); }
        function resetTimer() { pauseTimer(); timerSeconds=0; const el=document.getElementById('timerDisplay'); if(el) el.textContent='00:00'; }

        // ==================== 课后复盘 ====================
        function renderReviews(area) {
            let html = '<div class="card"><button class="btn btn-primary" onclick="showReviewModal()">+ 新建复盘</button></div>';
            if (lessonReviews.length === 0) {
                html += '<div class="card empty-state"><div class="big-icon">📋</div><p>还没有复盘记录</p></div>';
            } else {
                html += '<div class="card"><table><thead><tr><th>学生</th><th>掌握</th><th>态度</th><th>时间</th><th>操作</th></tr></thead><tbody>';
                lessonReviews.forEach(r => {
                    html += `<tr><td>${getStudentName(r.student_id)}</td><td>${(r.mastered||'').substring(0,15)}</td><td>${'⭐'.repeat(r.attitude_score||3)}</td><td>${formatDate(r.created_at)}</td>
                    <td><button class="btn btn-outline btn-sm" onclick="showReviewModal(null,${r.id})">查看</button> <button class="btn btn-success btn-sm" onclick="generateFeedback(${r.id})">反馈</button></td></tr>`;
                });
                html += '</tbody></table></div>';
            }
            area.innerHTML = html;
        }

        function showReviewModal(planId=null, reviewId=null) {
            const r = reviewId ? lessonReviews.find(r => r.id === reviewId) : {};
            document.getElementById('modalContainer').innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:800px;"><h2>${reviewId?'复盘详情':'新建复盘'}</h2>
                <div class="row"><div class="col"><label>关联备课</label><select id="r_plan_id">${lessonPlans.map(p => `<option value="${p.id}" ${(r.lesson_plan_id||planId)===p.id?'selected':''}>${p.title||'未命名'}</option>`).join('')}</select></div>
                <div class="col"><label>学生</label><select id="r_student_id">${students.map(s => `<option value="${s.id}" ${r.student_id===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div></div>
                <label>已掌握</label><textarea id="r_mastered">${r.mastered||''}</textarea>
                <label>未掌握</label><textarea id="r_not_mastered">${r.not_mastered||''}</textarea>
                <label>反复错题</label><textarea id="r_repeated_mistakes">${r.repeated_mistakes||''}</textarea>
                <div class="row"><div class="col"><label>态度</label><select id="r_attitude"><option value="5" ${r.attitude_score===5?'selected':''}>⭐⭐⭐⭐⭐</option><option value="4" ${r.attitude_score===4?'selected':''}>⭐⭐⭐⭐</option><option value="3" ${r.attitude_score===3?'selected':''} selected>⭐⭐⭐</option><option value="2" ${r.attitude_score===2?'selected':''}>⭐⭐</option><option value="1" ${r.attitude_score===1?'selected':''}>⭐</option></select></div>
                <div class="col"><label>时间复盘</label><input id="r_time_review" value="${r.time_review||''}"></div></div>
                <label>自我反思</label><textarea id="r_self_reflection">${r.self_reflection||''}</textarea>
                <div class="row"><div class="col"><label>布置作业</label><textarea id="r_homework_assigned">${r.homework_assigned||''}</textarea></div><div class="col"><label>截止日期</label><input type="date" id="r_homework_deadline" value="${r.homework_deadline||''}"></div></div>
                <label>下次重点</label><input id="r_next_topic" value="${r.next_topic||''}">
                <br><button class="btn btn-primary" onclick="saveReview(${reviewId||0})">保存</button> <button class="btn btn-outline" onclick="closeModal()">取消</button>
                <div id="feedbackArea"></div></div></div>`;
        }

        async function saveReview(id) {
            const g = (n) => document.getElementById(n)?.value || '';
            const data = { lesson_plan_id: parseInt(g('r_plan_id')), student_id: parseInt(g('r_student_id')), mastered: g('r_mastered'), not_mastered: g('r_not_mastered'), repeated_mistakes: g('r_repeated_mistakes'), attitude_score: parseInt(g('r_attitude')), time_review: g('r_time_review'), self_reflection: g('r_self_reflection'), homework_assigned: g('r_homework_assigned'), homework_deadline: g('r_homework_deadline'), next_topic: g('r_next_topic') };
            await api('/api/lesson-reviews' + (id ? '/'+id : ''), id ? 'PUT' : 'POST', data);
            closeModal(); renderPage();
        }

        async function generateFeedback(reviewId) {
            const r = lessonReviews.find(r => r.id === reviewId);
            if (!r) return;
            const res = await api('/api/generate-feedback', 'POST', { mastered: r.mastered, not_mastered: r.not_mastered, attitude_score: r.attitude_score, next_topic: r.next_topic });
            const fb = document.getElementById('feedbackArea');
            if (fb) fb.innerHTML = `<div class="feedback-box"><strong>📩 家长反馈：</strong><br><br>${res.feedback}</div>`;
        }

        // ==================== 长期跟进 ====================
        function renderTracking(area) {
            area.innerHTML = `<div class="tab-bar"><button class="tab active" onclick="renderTrackingTab('errors',this)">📕 错题本</button><button class="tab" onclick="renderTrackingTab('tests',this)">📊 阶段小测</button></div><div id="trackingContent"></div>`;
            renderTrackingTab('errors');
        }

        function renderTrackingTab(tab, el) {
            if (el) { document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); el.classList.add('active'); }
            const area = document.getElementById('trackingContent');
            if (tab === 'errors') {
                let html = '<div class="card"><button class="btn btn-primary" onclick="showErrorModal()">+ 添加错题</button></div>';
                if (errorBook.length===0) html += '<div class="card empty-state"><p>暂无错题</p></div>';
                else {
                    html += '<div class="card"><table><thead><tr><th>学生</th><th>知识点</th><th>题目</th><th>原因</th><th>时间</th></tr></thead><tbody>';
                    errorBook.forEach(e => { html += `<tr><td>${getStudentName(e.student_id)}</td                    <td><span class="badge badge-orange">${e.knowledge_point||'-'}</span></td>
                    <td>${(e.question||'').substring(0,20)}</td>
                    <td>${e.reason||'-'}</td>
                    <td>${formatDate(e.added_at)}</td></tr>`;
                });
                html += '</tbody></table></div>';
            }
            area.innerHTML = html;
        } else {
            let html = '<div class="card"><button class="btn btn-primary" onclick="showTestModal()">+ 添加小测</button></div>';
            if (stageTests.length===0) html += '<div class="card empty-state"><p>暂无小测</p></div>';
            else {
                html += '<div class="card"><table><thead><tr><th>学生</th><th>标题</th><th>成绩</th><th>日期</th></tr></thead><tbody>';
                stageTests.forEach(t => { const pct = t.total_score ? Math.round(t.score/t.total_score*100) : 0;
                    html += `<tr><td>${getStudentName(t.student_id)}</td><td>${t.test_title||'-'}</td><td><span class="badge ${pct>=80?'badge-green':pct>=60?'badge-blue':'badge-orange'}">${t.score}/${t.total_score} (${pct}%)</span></td><td>${formatDate(t.test_date)}</td></tr>`; });
                html += '</tbody></table></div>';
            }
            area.innerHTML = html;
        }
    }

    function showErrorModal() {
        document.getElementById('modalContainer').innerHTML = `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>添加错题</h2>
            <div class="row"><div class="col"><label>学生</label><select id="e_student_id">${students.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}</select></div>
            <div class="col"><label>知识点</label><input id="e_knowledge_point"></div></div>
            <label>题目</label><textarea id="e_question"></textarea>
            <div class="row"><div class="col"><label>错误答案</label><input id="e_wrong_answer"></div><div class="col"><label>正确答案</label><input id="e_correct_answer"></div></div>
            <label>错误原因</label><input id="e_reason"><label>来源</label><input id="e_source">
            <br><button class="btn btn-primary" onclick="saveError()">保存</button> <button class="btn btn-outline" onclick="closeModal()">取消</button></div></div>`;
    }

    async function saveError() {
        const g = (n) => document.getElementById(n)?.value || '';
        await api('/api/error-book', 'POST', { student_id: parseInt(g('e_student_id')), knowledge_point: g('e_knowledge_point'), question: g('e_question'), wrong_answer: g('e_wrong_answer'), correct_answer: g('e_correct_answer'), reason: g('e_reason'), source: g('e_source') });
        closeModal(); loadAllData().then(() => renderTrackingTab('errors'));
    }

    function showTestModal() {
        document.getElementById('modalContainer').innerHTML = `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>添加小测</h2>
            <div class="row"><div class="col"><label>学生</label><select id="t_student_id">${students.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}</select></div>
            <div class="col"><label>标题</label><input id="t_test_title"></div></div>
            <div class="row"><div class="col"><label>得分</label><input type="number" id="t_score" value="0"></div><div class="col"><label>总分</label><input type="number" id="t_total_score" value="100"></div><div class="col"><label>日期</label><input type="date" id="t_test_date"></div></div>
            <label>备注</label><textarea id="t_notes"></textarea>
            <br><button class="btn btn-primary" onclick="saveTest()">保存</button> <button class="btn btn-outline" onclick="closeModal()">取消</button></div></div>`;
    }

    async function saveTest() {
        const g = (n) => document.getElementById(n)?.value || '';
        await api('/api/stage-tests', 'POST', { student_id: parseInt(g('t_student_id')), test_title: g('t_test_title'), score: parseFloat(g('t_score')), total_score: parseFloat(g('t_total_score')), notes: g('t_notes'), test_date: g('t_test_date') });
        closeModal(); loadAllData().then(() => renderTrackingTab('tests'));
    }

    // ==================== 数据中心 ====================
    async function renderDashboard(area) {
        const stats = await api('/api/statistics');
        let html = `<div class="row">
            <div class="col"><div class="card" style="text-align:center;"><div style="font-size:48px;">👥</div><div style="font-size:36px;font-weight:bold;">${stats.total_students||0}</div><div>学生总数</div></div></div>
            <div class="col"><div class="card" style="text-align:center;"><div style="font-size:48px;">📝</div><div style="font-size:36px;font-weight:bold;">${stats.total_lessons||0}</div><div>总课时</div></div></div>
            <div class="col"><div class="card" style="text-align:center;"><div style="font-size:48px;">📕</div><div style="font-size:36px;font-weight:bold;">${errorBook.length}</div><div>错题总数</div></div></div>
        </div>
        <div class="card"><h3>各学生课时</h3><table><thead><tr><th>学生</th><th>课时</th><th>进度</th></tr></thead><tbody>`;
        if (stats.student_lessons) {
            const max = Math.max(...stats.student_lessons.map(x=>x.count), 1);
            stats.student_lessons.forEach(s => { const pct = Math.round(s.count/max*100);
                html += `<tr><td>${s.name}</td><td>${s.count} 次</td><td><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></td></tr>`; });
        }
        html += '</tbody></table></div>';
        area.innerHTML = html;
    }

    // 启动
    renderPage();
</script>
</body>
</html>
